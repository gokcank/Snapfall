<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Snapfall - 2D Bubble Shooter Mobile Game" />
    <title>Snapfall: Bubble Shooter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="game-container">
      <header class="hud-header">
        <div class="hud-stat">
          <span class="hud-label">Skor</span>
          <span class="hud-value" id="scoreValue">0</span>
        </div>
        <div class="hud-title">Snapfall</div>
        <div class="hud-stat" style="text-align: right;">
          <span class="hud-label">Aşama</span>
          <span class="hud-value" id="levelValue">2</span>
        </div>
      </header>

      <main class="canvas-wrapper">
        <canvas id="gameCanvas" width="480" height="680"></canvas>
      </main>

      <footer class="hud-footer">
        <span class="badge"><span class="status-dot"></span> Aşama 2: Fırlatma &amp; Fizik</span>
        <span id="coordInfo">Nişan almak için dokunun veya sürükleyin</span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
